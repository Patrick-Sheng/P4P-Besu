## Area 4 - Volume test. Fixed n=7 validators.
##
## Pushes toward the full estimated dataset (~2.9M vote transactions, see
## perf-testing/README.md for how that figure was derived) and checks whether
## getTally()/getVoterState() read latency degrades as registeredVoters/
## voterState/voteCount state grows. Structured as 5 write phases of ~580,000
## votes each (400 TPS), each immediately followed by a short read-probe
## round - so compute-percentiles.js on the 5 read-probe rounds (1, 3, 5, 7, 9
## below) gives read latency at roughly 20/40/60/80/100% of final state size.
##
## This is the largest voter pool in the suite - generation and registration
## alone will take a while; consider running them as an unattended/background
## step.
##
## Prerequisites:
##   node deploy-and-configure.js 7
##   node seed/generate-voters.js 2900000 seed/generated/n7-volume.json
##   node seed/register-voters.js networks/besu-n7.json seed/generated/n7-volume.json --concurrency=300
##
## Run with (from perf-testing/caliper/):
##   npx caliper launch manager --caliper-workspace . \
##     --caliper-networkconfig networks/besu-n7.json \
##     --caliper-benchconfig benchmarks/throughput/volume.yaml \
##     --caliper-flow-skip-install --caliper-flow-skip-start --caliper-flow-skip-end \
##     --caliper-report-path reports/throughput-volume.html

test:
  workers:
    number: 16
  rounds:
    - label: volume-write-phase-1-of-5
      txNumber: 580000
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload:
        module: workloads/cast-vote.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-read-probe-at-20pct
      description: Read latency with ~580k votes cast (~20% of final state)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload:
        module: workloads/read-queries.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-write-phase-2-of-5
      txNumber: 580000
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload:
        module: workloads/cast-vote.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-read-probe-at-40pct
      description: Read latency with ~1.16M votes cast (~40% of final state)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload:
        module: workloads/read-queries.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-write-phase-3-of-5
      txNumber: 580000
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload:
        module: workloads/cast-vote.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-read-probe-at-60pct
      description: Read latency with ~1.74M votes cast (~60% of final state)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload:
        module: workloads/read-queries.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-write-phase-4-of-5
      txNumber: 580000
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload:
        module: workloads/cast-vote.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-read-probe-at-80pct
      description: Read latency with ~2.32M votes cast (~80% of final state)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload:
        module: workloads/read-queries.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-write-phase-5-of-5
      txNumber: 580000
      rateControl: { type: fixed-rate, opts: { tps: 400 } }
      workload:
        module: workloads/cast-vote.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }
    - label: volume-read-probe-at-100pct
      description: Read latency with ~2.9M votes cast (final state size)
      txNumber: 500
      rateControl: { type: fixed-rate, opts: { tps: 50 } }
      workload:
        module: workloads/read-queries.js
        arguments: { votersFile: seed/generated/n7-volume.json, numCandidates: 3 }

monitors:
  resource:
    - module: docker
      options:
        interval: 30
        containers:
          - besu-n7-validator1
          - besu-n7-validator2
          - besu-n7-validator3
          - besu-n7-validator4
          - besu-n7-validator5
          - besu-n7-validator6
          - besu-n7-validator7
