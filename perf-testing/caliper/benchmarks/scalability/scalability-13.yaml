## Area 1 - Scalability (node count sweep), n=13 validators (f=4).
## Run the same 300/400/500 TPS step-load against each of n=4/7/10/13 to build
## an empirical throughput/latency-vs-n curve and locate where IBFT's O(n^2)
## message complexity starts eating into headroom.
##
## Prerequisites (see perf-testing/README.md):
##   node deploy-and-configure.js 13
##   node seed/generate-voters.js 220000 seed/generated/n13-scalability.json
##   node seed/register-voters.js networks/besu-n13.json seed/generated/n13-scalability.json --concurrency=200
##
## After each round, feed the round's block range into
## perf-testing/monitoring/block-time-drift.js for block-time drift, and the
## round index into perf-testing/monitoring/compute-percentiles.js for
## p50/p95/p99 vote confirmation latency (Caliper's own report only has
## min/max/avg).
##
## Run with (from perf-testing/caliper/):
##   npx caliper launch manager --caliper-workspace . \
##     --caliper-networkconfig networks/besu-n13.json \
##     --caliper-benchconfig benchmarks/scalability/scalability-13.yaml \
##     --caliper-flow-skip-install --caliper-flow-skip-start --caliper-flow-skip-end \
##     --caliper-report-path reports/scalability-13.html

test:
  workers:
    # Concurrency comes from the rate controller firing many in-flight
    # requests per worker (Caliper's worker loop doesn't await each
    # submitTransaction before scheduling the next one), not from worker
    # count alone - but more workers gives more OS-level parallelism for
    # request signing/serialization. Tune to available cores.
    number: 10
  rounds:
    - label: scalability-n13-300tps
      description: n=13 validators, target 300 TPS sustained
      txDuration: 180
      rateControl:
        type: fixed-rate
        opts:
          tps: 300
      workload:
        module: workloads/cast-vote.js
        arguments:
          votersFile: seed/generated/n13-scalability.json
          numCandidates: 3
    - label: scalability-n13-400tps
      description: n=13 validators, target 400 TPS sustained
      txDuration: 180
      rateControl:
        type: fixed-rate
        opts:
          tps: 400
      workload:
        module: workloads/cast-vote.js
        arguments:
          votersFile: seed/generated/n13-scalability.json
          numCandidates: 3
    - label: scalability-n13-500tps
      description: n=13 validators, stretch-goal 500 TPS burst
      txDuration: 180
      rateControl:
        type: fixed-rate
        opts:
          tps: 500
      workload:
        module: workloads/cast-vote.js
        arguments:
          votersFile: seed/generated/n13-scalability.json
          numCandidates: 3

monitors:
  resource:
    - module: docker
      options:
        interval: 5
        containers:
          - besu-n13-validator1
          - besu-n13-validator2
          - besu-n13-validator3
          - besu-n13-validator4
          - besu-n13-validator5
          - besu-n13-validator6
          - besu-n13-validator7
          - besu-n13-validator8
          - besu-n13-validator9
          - besu-n13-validator10
          - besu-n13-validator11
          - besu-n13-validator12
          - besu-n13-validator13
